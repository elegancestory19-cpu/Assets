<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@page{size:6cm 10cm;margin:0}
@font-face{font-family:Ar;font-weight:900;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-arabic-900-normal.woff2)}
@font-face{font-family:Ar;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-arabic-700-normal.woff2)}
@font-face{font-family:La;font-weight:900;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-latin-900-normal.woff2)}
:root{--g:#00703c;--gd:#004d2a;--r:#d21034;--rd:#9e0b26;--ink:#13261c}
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{width:720px;height:1200px;overflow:hidden;background:#fff;font-family:La,Ar,sans-serif}
.p{position:relative;width:720px;height:1200px;overflow:hidden;
 background:radial-gradient(ellipse 80% 40% at 50% 38%,#fff 0%,#f1f5f2 60%,#e3ebe6 100%)}
.p:before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(0,112,60,.035) 0 2px,transparent 2px 18px)}
.head{position:absolute;top:0;left:0;right:0;height:250px;background:linear-gradient(160deg,var(--g),var(--gd));
 clip-path:polygon(0 0,100% 0,100% 80%,50% 100%,0 80%);color:#fff;text-align:center;padding-top:30px}
.party{display:flex;justify-content:center;align-items:center;gap:14px;font-weight:900;font-size:40px;line-height:1.15}
.rnd{font-family:La;font-weight:900;font-size:30px;letter-spacing:3px;background:#fff;color:var(--r);padding:0 14px 4px;border-radius:9px}
.sub{margin-top:12px;font-family:Ar;font-weight:700;font-size:25px}
.sub b{color:#ffd9df}
.lst{display:inline-flex;align-items:center;gap:10px;margin-top:12px;background:#fff;color:var(--g);border-radius:30px;padding:0 8px 4px 22px;font-family:Ar;font-weight:900;font-size:26px}
.lst i{font-style:normal;font-family:La;background:var(--r);color:#fff;border-radius:50%;width:40px;height:40px;line-height:37px;font-size:28px;display:inline-block;margin-top:4px}
.ring{position:absolute;left:50%;top:300px;width:420px;height:420px;margin-left:-210px;border-radius:50%;
 border:11px solid transparent;background:conic-gradient(from 200deg,var(--g) 0 50%,var(--r) 50% 100%) border-box;
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor}
.ring2{position:absolute;left:50%;top:318px;width:384px;height:384px;margin-left:-192px;border-radius:50%;background:linear-gradient(180deg,#eef4f0,#dbe7e0)}
.person{position:absolute;left:50%;top:268px;width:560px;margin-left:-280px;z-index:3;filter:drop-shadow(0 8px 14px rgba(0,0,0,.18));
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
/* HERO rank */
.rank{position:absolute;left:40px;right:40px;top:690px;height:230px;z-index:7;border-radius:30px;
 background:linear-gradient(165deg,#ff2e52,var(--r) 45%,var(--rd));color:#fff;display:flex;align-items:center;
 box-shadow:0 22px 44px rgba(158,11,38,.45),inset 0 0 0 8px rgba(255,255,255,.22);padding:0 34px 0 0}
.rank .t{flex:1;text-align:center;font-family:Ar;font-weight:900;font-size:58px;line-height:1.05}
.rank .t small{display:block;font-size:36px;font-weight:700;opacity:.92;margin-top:6px}
.rank .n{width:250px;height:250px;margin:-10px 0 -10px -20px;background:#fff;color:var(--r);border-radius:50%;
 font-family:La;font-weight:900;font-size:250px;line-height:238px;text-align:center;box-shadow:0 14px 30px rgba(0,0,0,.3);border:10px solid var(--g)}
.ck{position:absolute;top:-30px;right:-18px;width:84px;height:84px;border-radius:50%;background:var(--g);border:6px solid #fff;text-align:center;box-shadow:0 8px 16px rgba(0,0,0,.25)}
.ck svg{width:48px;margin-top:17px}
.foot{position:absolute;left:0;right:0;bottom:0;height:330px;z-index:4;background:linear-gradient(180deg,var(--g),var(--gd))}
.foot:after{content:"";position:absolute;left:0;right:0;bottom:0;height:12px;background:var(--r)}
.cap{position:absolute;left:0;right:0;bottom:0;height:270px;z-index:6;text-align:center;color:#fff}
.name{font-family:Ar;font-weight:900;font-size:76px;line-height:1.2;margin-top:28px;text-shadow:0 5px 14px rgba(0,0,0,.25);white-space:nowrap}
.cta{display:inline-flex;align-items:center;gap:16px;margin-top:10px;background:#fff;color:var(--ink);border-radius:18px;padding:2px 10px 8px 26px;font-family:Ar;font-weight:900;font-size:38px;box-shadow:0 8px 18px rgba(0,0,0,.25)}
.cta i{font-style:normal;font-family:La;font-size:58px;line-height:1;background:var(--r);color:#fff;border-radius:12px;padding:0 22px 10px}
</style></head><body><div class="p">
<div class="head"><div class="party"><span style="font-family:Ar">التجمع الوطني الديمقراطي</span><span class="rnd">RND</span></div>
 <div class="sub">انتخابات <b>المجلس الشعبي البلدي</b> — قسنطينة</div>
 <div class="lst">القائمة رقم <i>2</i></div></div>
<div class="ring"></div><div class="ring2"></div><img class="person" src="person.png">
<div class="foot"></div>
<div class="rank"><div class="ck"><svg viewBox="0 0 100 80"><path d="M12 42 L38 66 L90 10" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div class="t">الترتيب<small>في القائمة</small></div><div class="n">9</div></div>
<div class="cap"><div class="name">لطرش عبد الرحمن</div><div class="cta">إنتخب المترشح رقم <i>9</i></div></div>
</div></body></html>
