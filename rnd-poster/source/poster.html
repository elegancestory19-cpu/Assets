<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;font-weight:900;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-arabic-900-normal.woff2)}
@font-face{font-family:Ar;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-arabic-700-normal.woff2)}
@font-face{font-family:Ar;font-weight:500;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-arabic-500-normal.woff2)}
@font-face{font-family:La;font-weight:900;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-latin-900-normal.woff2)}
@font-face{font-family:La;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-latin-700-normal.woff2)}
:root{--g:#00703c;--gd:#004d2a;--r:#d21034;--rd:#9e0b26;--ink:#13261c}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1600px;font-family:La,Ar,sans-serif;background:#fff;overflow:hidden}
.p{position:relative;width:1200px;height:1600px;overflow:hidden;
 background:radial-gradient(ellipse 70% 45% at 50% 52%,#ffffff 0%,#f3f6f4 60%,#e6ece8 100%)}
/* subtle pattern */
.p:before{content:"";position:absolute;inset:0;opacity:.35;
 background-image:repeating-linear-gradient(135deg,rgba(0,112,60,.06) 0 2px,transparent 2px 22px)}
.head{position:absolute;top:0;left:0;right:0;height:350px;background:linear-gradient(160deg,var(--g),var(--gd));
 clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);color:#fff;text-align:center;padding-top:46px}
.stripe{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,var(--g) 0 50%,#fff 50% 52%,var(--r) 52%)}
.party{display:flex;justify-content:center;align-items:center;gap:22px;font-weight:900;font-size:60px;line-height:1.1}
.rnd{font-family:La;font-weight:900;font-size:44px;letter-spacing:4px;background:#fff;color:var(--r);padding:2px 22px 6px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.sub{margin-top:22px;font-family:Ar;font-weight:700;font-size:38px;opacity:.95}
.sub b{color:#ffd9df}
.line{width:120px;height:4px;background:#fff;opacity:.6;margin:20px auto 0;border-radius:4px}
/* rank badge - hero element */
.rank{position:absolute;top:400px;left:56px;width:400px;height:560px;z-index:7;border-radius:40px;
 background:linear-gradient(165deg,#ff2e52,var(--r) 45%,var(--rd));color:#fff;text-align:center;
 box-shadow:0 30px 60px rgba(158,11,38,.45),inset 0 0 0 10px rgba(255,255,255,.22)}
.rank .t{font-family:Ar;font-weight:900;font-size:64px;margin-top:26px;line-height:1.05}.rank .t small{font-size:40px;font-weight:700;opacity:.92}
.rank .n{font-family:La;font-weight:900;font-size:360px;line-height:.8;margin-top:0;text-shadow:0 14px 30px rgba(0,0,0,.3)}
.rank .b{position:absolute;left:0;right:0;bottom:0;height:110px;background:#fff;color:var(--r);border-radius:0 0 40px 40px;
 font-family:Ar;font-weight:900;font-size:48px;line-height:104px}
.rank .ck{position:absolute;top:-34px;right:-34px;width:110px;height:110px;border-radius:50%;background:var(--g);border:8px solid #fff;box-shadow:0 10px 20px rgba(0,0,0,.25)}
.rank .ck svg{width:66px;margin-top:22px}
.lst{display:inline-flex;align-items:center;gap:14px;margin-top:20px;background:#fff;color:var(--g);border-radius:40px;padding:2px 10px 6px 30px;font-family:Ar;font-weight:900;font-size:36px}
.lst i{font-style:normal;font-family:La;background:var(--r);color:#fff;border-radius:50%;width:56px;height:56px;line-height:52px;font-size:40px;display:inline-block;margin-top:4px}
.halo{position:absolute;left:770px;top:430px;width:680px;height:680px;margin-left:-340px;border-radius:50%;
 background:radial-gradient(circle,#fff 0 55%,rgba(255,255,255,0) 70%);}
.ring{position:absolute;left:770px;top:470px;width:580px;height:580px;margin-left:-290px;border-radius:50%;
 border:14px solid transparent;background:conic-gradient(from 200deg,var(--g) 0 50%,var(--r) 50% 100%) border-box;
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ring2{position:absolute;left:770px;top:494px;width:532px;height:532px;margin-left:-266px;border-radius:50%;background:linear-gradient(180deg,#eef4f0,#dfe9e3)}
.person{position:absolute;left:770px;top:460px;width:720px;margin-left:-360px;z-index:3;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
.foot{position:absolute;left:0;right:0;bottom:0;height:470px;z-index:4;
 background:linear-gradient(180deg,var(--g),var(--gd));clip-path:polygon(0 16%,50% 0,100% 16%,100% 100%,0 100%)}
.foot:after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--r)}
.cap{position:absolute;left:0;right:0;bottom:0;height:400px;z-index:6;text-align:center;color:#fff}
.name{font-family:Ar;font-weight:900;font-size:116px;line-height:1.2;margin-top:70px;text-shadow:0 6px 18px rgba(0,0,0,.25)}
.cta{display:inline-flex;align-items:center;gap:22px;margin-top:8px;background:#fff;color:var(--ink);border-radius:22px;padding:4px 14px 10px 34px;box-shadow:0 10px 24px rgba(0,0,0,.25);font-family:Ar;font-weight:900;font-size:50px}
.cta i{font-style:normal;font-family:La;font-weight:900;font-size:76px;line-height:1;background:var(--r);color:#fff;border-radius:16px;padding:2px 30px 12px}
</style></head><body><div class="p">
<div class="head">
 <div class="party"><span style="font-family:Ar">التجمع الوطني الديمقراطي</span><span class="rnd">RND</span></div>
 <div class="sub">انتخابات <b>المجلس الشعبي البلدي</b> — قسنطينة</div>
 <div class="lst">القائمة رقم <i>2</i></div></div>
<div class="rank"><div class="ck"><svg viewBox="0 0 100 80"><path d="M12 42 L38 66 L90 10" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div class="t">الترتيب<br><small>في القائمة</small></div><div class="n">9</div><div class="b">إنتخب ✓</div></div>
<div class="halo"></div><div class="ring"></div><div class="ring2"></div>
<img class="person" src="person.png">
<div class="foot"></div>
<div class="cap"><div class="name">لطرش عبد الرحمن</div>
 <div class="cta">إنتخب المترشح رقم <i>9</i></div></div>
</div></div></body></html>
