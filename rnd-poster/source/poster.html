<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Ar;font-weight:900;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-arabic-900-normal.woff2)}
@font-face{font-family:Ar;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-arabic-700-normal.woff2)}
@font-face{font-family:Ar;font-weight:500;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-arabic-500-normal.woff2)}
@font-face{font-family:La;font-weight:900;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-latin-900-normal.woff2)}
@font-face{font-family:La;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/@fontsource/cairo@5.2.5/files/cairo-latin-700-normal.woff2)}
:root{--g:#00703c;--gd:#004d2a;--r:#d21034;--rd:#9e0b26;--ink:#13261c}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1600px;font-family:La,Ar,sans-serif;background:#fff;overflow:hidden}
.p{position:relative;width:1200px;height:1600px;overflow:hidden;
 background:radial-gradient(ellipse 70% 45% at 50% 52%,#ffffff 0%,#f3f6f4 60%,#e6ece8 100%)}
/* subtle pattern */
.p:before{content:"";position:absolute;inset:0;opacity:.35;
 background-image:repeating-linear-gradient(135deg,rgba(0,112,60,.06) 0 2px,transparent 2px 22px)}
.head{position:absolute;top:0;left:0;right:0;height:330px;background:linear-gradient(160deg,var(--g),var(--gd));
 clip-path:polygon(0 0,100% 0,100% 78%,50% 100%,0 78%);color:#fff;text-align:center;padding-top:46px}
.stripe{position:absolute;top:0;left:0;right:0;height:14px;background:linear-gradient(90deg,var(--g) 0 50%,#fff 50% 52%,var(--r) 52%)}
.party{display:flex;justify-content:center;align-items:center;gap:22px;font-weight:900;font-size:60px;line-height:1.1}
.rnd{font-family:La;font-weight:900;font-size:44px;letter-spacing:4px;background:#fff;color:var(--r);padding:2px 22px 6px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.sub{margin-top:22px;font-family:Ar;font-weight:700;font-size:38px;opacity:.95}
.sub b{color:#ffd9df}
.line{width:120px;height:4px;background:#fff;opacity:.6;margin:20px auto 0;border-radius:4px}
/* list badge */
.list{position:absolute;top:360px;right:70px;width:230px;height:230px;border-radius:50%;
 background:radial-gradient(circle at 35% 30%,#ff3b5c,var(--r) 45%,var(--rd));color:#fff;text-align:center;
 box-shadow:0 18px 40px rgba(158,11,38,.35),inset 0 0 0 10px rgba(255,255,255,.18);z-index:5}
.list .t{font-family:Ar;font-weight:700;font-size:34px;margin-top:30px}
.list .n{font-family:La;font-weight:900;font-size:130px;line-height:.95}
/* vote box */
.vote{position:absolute;top:385px;left:70px;z-index:5;text-align:center}
.box{width:170px;height:170px;border-radius:26px;background:#fff;border:9px solid var(--g);box-shadow:0 14px 30px rgba(0,77,42,.25);position:relative}
.box svg{position:absolute;left:10px;top:-38px;width:190px}
.vote .v{margin-top:14px;font-family:Ar;font-weight:900;font-size:58px;color:var(--g)}
/* photo */
.halo{position:absolute;left:50%;top:420px;width:700px;height:700px;margin-left:-350px;border-radius:50%;
 background:radial-gradient(circle,#fff 0 55%,rgba(255,255,255,0) 70%);}
.ring{position:absolute;left:50%;top:455px;width:620px;height:620px;margin-left:-310px;border-radius:50%;
 border:14px solid transparent;background:conic-gradient(from 200deg,var(--g) 0 50%,var(--r) 50% 100%) border-box;
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.ring2{position:absolute;left:50%;top:480px;width:570px;height:570px;margin-left:-285px;border-radius:50%;background:linear-gradient(180deg,#eef4f0,#dfe9e3)}
.person{position:absolute;left:50%;top:445px;width:760px;margin-left:-380px;z-index:3;filter:drop-shadow(0 10px 18px rgba(0,0,0,.18));-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
/* bottom */
.foot{position:absolute;left:0;right:0;bottom:0;height:500px;z-index:4;
 background:linear-gradient(180deg,var(--r),var(--rd));clip-path:polygon(0 18%,50% 0,100% 18%,100% 100%,0 100%)}
.foot:after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--g)}
.cap{position:absolute;left:0;right:0;bottom:0;height:420px;z-index:6;text-align:center;color:#fff}
.lab{display:inline-block;margin-top:58px;font-family:Ar;font-weight:700;font-size:34px;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.45);padding:2px 34px 6px;border-radius:40px}
.name{font-family:Ar;font-weight:900;font-size:118px;line-height:1.25;margin-top:6px;text-shadow:0 6px 18px rgba(0,0,0,.25)}
.num{display:inline-flex;align-items:center;gap:20px;margin-top:6px;background:#fff;color:var(--ink);border-radius:20px;padding:6px 16px 10px 34px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.num span{font-family:Ar;font-weight:700;font-size:42px}
.num i{font-style:normal;font-family:La;font-weight:900;font-size:62px;line-height:1;background:var(--g);color:#fff;border-radius:14px;padding:4px 26px 10px}
</style></head><body><div class="p">
<div class="head">
 <div class="party"><span style="font-family:Ar">التجمع الوطني الديمقراطي</span><span class="rnd">RND</span></div>
 <div class="sub">انتخابات <b>المجلس الشعبي البلدي</b> — قسنطينة</div><div class="line"></div></div>
<div class="list"><div class="t">القائمة رقم</div><div class="n">2</div></div>
<div class="vote"><div class="box"><svg viewBox="0 0 100 80"><path d="M14 42 L38 64 L92 8" fill="none" stroke="#d21034" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="v">إنتخب</div></div>
<div class="halo"></div><div class="ring"></div><div class="ring2"></div>
<img class="person" src="person.png">
<div class="foot"></div>
<div class="cap"><div class="lab">مرشحكم للمجلس الشعبي البلدي</div>
 <div class="name">لطرش عبد الرحمن</div>
 <div class="num"><span>الترتيب في القائمة</span><i>9</i></div></div>
</div></body></html>
