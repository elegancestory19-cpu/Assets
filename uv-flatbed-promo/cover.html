<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Cover</title>
<style>
@font-face{font-family:Alexandria;font-weight:900;src:url(node_modules/@fontsource/alexandria/files/alexandria-arabic-900-normal.woff2) format("woff2")}
@font-face{font-family:Alexandria;font-weight:700;src:url(node_modules/@fontsource/alexandria/files/alexandria-arabic-700-normal.woff2) format("woff2")}
@font-face{font-family:AlexLat;font-weight:900;src:url(node_modules/@fontsource/alexandria/files/alexandria-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:Amiri;font-weight:700;src:url(node_modules/@fontsource/amiri/files/amiri-arabic-700-normal.woff2) format("woff2")}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow:hidden}
body{width:1080px;height:1920px;overflow:hidden;background:#0a0a12;font-family:Alexandria,AlexLat,sans-serif;color:#fff;position:relative}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translateY(7.5%) scale(1.16);transform-origin:50% 50%}
#sc{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,18,.96) 0%,rgba(8,8,18,.93) 34%,rgba(8,8,18,.55) 46%,rgba(8,8,18,0) 58%,rgba(8,8,18,0) 84%,rgba(8,8,18,.7) 100%)}
#t{position:absolute;left:80px;right:80px;top:330px;text-align:right}
.brand{direction:ltr;text-align:right;font-family:AlexLat;font-weight:900;font-size:36px;letter-spacing:.32em;margin-right:-.32em}
.dots{display:flex;gap:14px;margin:26px 0 30px}
.dots i{width:30px;height:30px;border-radius:50%}
h1{font-weight:900;font-size:160px;line-height:1.08;white-space:nowrap}
h1 b{font-family:AlexLat;color:#ffd60a}
h2{font-weight:900;font-size:140px;line-height:1.12;white-space:nowrap}
.am{font-family:Amiri;font-weight:700;font-size:80px;color:#ffd60a;line-height:1.3;margin-top:6px}
svg{display:block;width:400px;height:30px;margin:-8px 0 0 auto}
#chip{position:absolute;left:80px;bottom:170px;background:#ffd60a;color:#0a0a12;font-weight:900;font-size:50px;padding:22px 52px;border-radius:99px;transform:rotate(-4deg)}
</style></head><body>
<img id="bg" src="frames/f0398.jpg">
<div id="sc"></div>
<div id="t">
  <div class="brand">ELEGANCE STORY</div>
  <div class="dots"><i style="background:#12c8f4"></i><i style="background:#ff2d8a"></i><i style="background:#ffd60a"></i><i style="background:#2a3bff"></i></div>
  <h1>طباعة <b>UV</b></h1>
  <h2>المسطّحة</h2>
  <div class="am">من داخل ورشتنا</div>
  <svg viewBox="0 0 470 30" preserveAspectRatio="none"><path d="M6 18 C 90 4, 170 28, 260 14 S 420 8, 464 16" fill="none" stroke="#ffd60a" stroke-width="6" stroke-linecap="round"/></svg>
</div>
<div id="chip">شوف كيفاش نخدمو ▶</div>
</body></html>
