.title .b{top:322px;font-family:Amiri;font-weight:700;font-size:66px;color:#e0b84e}
.fan{left:0;right:0;top:830px;height:720px}
.c{position:absolute;top:40px;width:360px;height:595px;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55);background:#fff}
.c img{width:100%;height:100%;object-fit:cover}
