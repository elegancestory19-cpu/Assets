<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Cover</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}html{overflow:hidden}

.glass{background:linear-gradient(135deg,rgba(40,18,48,.82),rgba(20,10,28,.6));backdrop-filter:blur(24px);border:1.5px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),0 24px 60px rgba(0,0,0,.45);border-radius:34px}

.logo img{width:100%;height:100%}
.title{left:65px;right:65px;top:400px;height:420px;text-align:center}
.title>*{position:absolute;left:0;right:0}
.title .acc{left:0;top:60px;bottom:60px;right:auto;width:10px;background:#ff3d9a;border-radius:9px}
.title .a{top:90px;font-weight:900;font-size:112px;line-height:1.1;white-space:nowrap}
.title .b{top:268px;font-weight:900;font-size:64px;color:#ff3d9a}
.strip{left:65px;right:65px;top:1620px;height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.strip .p{font-weight:900;font-size:48px;white-space:nowrap}
.strip .p b{color:#ff3d9a}

<img class="bg" src="assets/cover_bg.png">

<div class="glass title"><div class="acc"></div><div class="a">أكياس التسوّق</div><div class="b">التصميم مجاني ★</div></div>
<div class="glass strip"><span class="p">ابتداءً من <b>28 دج</b> للكيس</span><span class="s">30×20 · 40×30 · 50×40</span></div>
